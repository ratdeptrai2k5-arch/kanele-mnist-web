<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>KANELE MNIST -- BLE FPGA & PC Verification</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --success-hover: #047857;
      --surface: #020617;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.5;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-container {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-badge.disconnected {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .canvas-layout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: center;
    }
    canvas#pad {
      display: block;
      width: 250px;
      height: 250px;
      background: #000;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      touch-action: none;
      cursor: crosshair;
    }
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    canvas#preview {
      display: block;
      width: 84px;
      height: 84px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .preview-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
    .preprocess-info {
      font-size: 11px;
      color: #38bdf8;
      text-align: center;
      margin-top: 8px;
      font-family: monospace;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    button.btn-ble {
      background: var(--primary);
      color: #fff;
    }
    button.btn-ble:hover { background: var(--primary-hover); }
    button.btn-verify {
      background: var(--success);
      color: #fff;
    }
    button.btn-verify:hover { background: var(--success-hover); }
    button.btn-clear {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.btn-clear:hover { background: rgba(148, 163, 184, 0.3); }
    output#result {
      display: block;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e2e8f0;
      min-height: 48px;
    }
    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
    }
    summary {
      font-weight: 600;
      cursor: pointer;
      color: #38bdf8;
      user-select: none;
    }
    .settings-body {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }
    input {
      font-family: monospace;
      font-size: 13px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
  </style>
</head>

    const pad = document.querySelector('#pad'), ctx = pad.getContext('2d'), result = document.querySelector('#result');
    let pointer = null, version = 0;

    function clearPad() {
      version++;
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, 250, 250);
      result.textContent = 'Da xoa. Hay ve chu so moi.';
      const prevCanvas = document.querySelector('#preview');
      if (prevCanvas) {
        const pctx = prevCanvas.getContext('2d');
        pctx.fillStyle = '#000';
        pctx.fillRect(0, 0, 28, 28);
      }
      const infoEl = document.querySelector('#preprocessInfo');
      if (infoEl) infoEl.textContent = 'Ve mot chu so (0 - 9) bang ngon tay...';
    }
    clearPad();
    document.querySelector('#clear').onclick = clearPad;

    function point(e) {
      const r = pad.getBoundingClientRect();
      return [(e.clientX - r.left) * 250 / r.width, (e.clientY - r.top) * 250 / r.height];
    }
    pad.onpointerdown = e => {
      if (pointer !== null) return;
      version++;
      result.textContent = 'Dang ve...';
      pointer = e.pointerId;
      pad.setPointerCapture(pointer);
      const [x, y] = point(e);
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, 2 * Math.PI);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 18;
      ctx.lineCap = ctx.lineJoin = 'round';
    };
    pad.onpointermove = e => {
      if (pointer === e.pointerId) {
        ctx.lineTo(...point(e));
        ctx.stroke();
      }
    };
    pad.onlostpointercapture = e => {
      if (pointer === e.pointerId) pointer = null;
    };

// Pillow-style bilinear reduction: widen the triangle filter when shrinking.
function weights(n, m, i) {
  const scale = n / m, width = Math.max(1, scale), center = (i + 0.5) * scale;
  const taps = [];
  for (let j = Math.max(0, Math.floor(center - width)); j < Math.min(n, Math.ceil(center + width)); j++) {
    const w = Math.max(0, 1 - Math.abs(j + 0.5 - center) / width);
    if (w) taps.push([j, w]);
  }
  const total = taps.reduce((a, t) => a + t[1], 0);
  return taps.map(([j, w]) => [j, Math.round(w / total * 4194304)]);
}

function quantizeWithMeta(rgba, size, table) {
  let left = size, right = -1, top = size, bottom = -1;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (rgba[4 * (y * size + x)] > 20) {
        left = Math.min(left, x);
        right = Math.max(right, x);
        top = Math.min(top, y);
        bottom = Math.max(bottom, y);
      }
    }
  }
  if (right < left) return null;

  const w = right - left + 1, h = bottom - top + 1;
  const evenRound = x => x % 1 === 0.5 ? 2 * Math.round(x / 2) : Math.round(x);
  const scale = 20 / Math.max(w, h);
  const nw = Math.max(1, evenRound(w * scale));
  const nh = Math.max(1, evenRound(h * scale));

  const tmp = new Uint8Array(nw * h);
  const out = new Uint8Array(784);
  function sample(taps, get) {
    return Math.min(255, Math.floor((2097152 + taps.reduce((a, [i, k]) => a + k * get(i), 0)) / 4194304));
  }

  for (let x = 0; x < nw; x++) {
    const taps = weights(w, nw, x);
    for (let y = 0; y < h; y++) {
      tmp[y * nw + x] = sample(taps, i => rgba[4 * ((y + top) * size + left + i)]);
    }
  }

  let mass = 0, mx = 0, my = 0;
  for (let y = 0; y < nh; y++) {
    const taps = weights(h, nh, y);
    for (let x = 0; x < nw; x++) {
      const v = sample(taps, i => tmp[i * nw + x]);
      const xx = x + ((28 - nw) >> 1);
      const yy = y + ((28 - nh) >> 1);
      out[yy * 28 + xx] = v;
      mass += v;
      mx += xx * v;
      my += yy * v;
    }
  }
  if (Math.max(...out) < 5 || mass === 0) return null;

  const packed = new Uint8Array(98);
  const preview28 = new Uint8Array(784);
  let activeBits = 0;

  for (let i = 0; i < 784; i++) {
    const x = (i % 28) + (mx / mass - 14);
    const y = Math.floor(i / 28) + (my / mass - 14);
    let v = 0;
    if (x >= 0 && y >= 0 && x <= 27 && y <= 27) {
      const a = Math.floor(x), b = Math.floor(y), dx = x - a, dy = y - b;
      const at = (xx, yy) => out[Math.min(27, yy) * 28 + Math.min(27, xx)];
      v = Math.fround((1 - dy) * ((1 - dx) * at(a, b) + dx * at(a + 1, b)) + dy * ((1 - dx) * at(a, b + 1) + dx * at(a + 1, b + 1)));
    }
    preview28[i] = Math.min(255, Math.max(0, Math.round(v)));
    const [first, threshold] = table[i];
    const bit = first ^ Number(threshold !== null && v >= threshold);
    if (bit) activeBits++;
    packed[i >> 3] |= bit << (7 - (i % 8));
  }

  return {
    packed,
    preview28,
    activeBits,
    activePct: ((activeBits / 784) * 100).toFixed(1),
    bbox: { left, right, top, bottom, w, h },
    com: { cx: (mx / mass).toFixed(1), cy: (my / mass).toFixed(1) }
  };
}

const hex = (v, w) => v.toString(16).toUpperCase().padStart(w, '0');

function crc(bytes) {
  let c = 65535;
  for (const b of bytes) {
    c ^= b << 8;
    for (let j = 0; j < 8; j++) {
      c = ((c << 1) ^ ((c & 32768) ? 4129 : 0)) & 65535;
    }
  }
  return c;
}

let writer = null, gattDevice = null, sequence = 0, busy = false, lastBody = null, lastLine = null;
const el = id => document.getElementById(id);

// Load persisted settings
const DEFAULT_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const DEFAULT_WRITE_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

function initSettings() {
  if (el('service')) el('service').value = localStorage.getItem('kanele_ble_service') || DEFAULT_SERVICE_UUID;
  if (el('write')) el('write').value = localStorage.getItem('kanele_ble_write') || DEFAULT_WRITE_UUID;
  if (el('pcUrl')) el('pcUrl').value = localStorage.getItem('kanele_pc_url') || '';
}
initSettings();

function updateBleBadge(connected, name) {
  const badge = el('bleBadge');
  const btn = el('connect');
  if (!badge) return;
  if (connected) {
    badge.textContent = '[BLE] Da ket noi: ' + (name || 'Kit');
    badge.className = 'status-badge connected';
    if (btn) btn.textContent = 'Ngat ket noi BLE';
  } else {
    badge.textContent = '[BLE] Chua ket noi';
    badge.className = 'status-badge disconnected';
    if (btn) btn.textContent = 'Ket noi Boolean Board';
  }
}

// Bluetooth connect / disconnect
el('connect').onclick = async () => {
  if (writer && gattDevice && gattDevice.gatt.connected) {
    try { gattDevice.gatt.disconnect(); } catch (e) {}
    writer = null;
    gattDevice = null;
    updateBleBadge(false);
    el('result').textContent = 'Da ngat ket noi BLE.';
    return;
  }

  try {
    if (!navigator.bluetooth) {
      throw Error('Trinh duyet can ho tro Web Bluetooth (Chrome Android hoac Bluefy tren iOS qua HTTPS).');
    }
    const serviceId = (el('service').value.trim() || DEFAULT_SERVICE_UUID).toLowerCase();
    const writeId = (el('write').value.trim() || DEFAULT_WRITE_UUID).toLowerCase();
    localStorage.setItem('kanele_ble_service', serviceId);
    localStorage.setItem('kanele_ble_write', writeId);

    el('result').textContent = 'Dang quet thiet bi Bluetooth...';
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [serviceId]
    });

    el('result').textContent = 'Dang ket noi toi ' + (device.name || 'kit') + '...';
    gattDevice = device;
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(serviceId);
    writer = await service.getCharacteristic(writeId);

    device.addEventListener('gattserverdisconnected', () => {
      writer = null;
      gattDevice = null;
      updateBleBadge(false);
      el('result').textContent = 'BLE da ngat ket noi.';
    });

    updateBleBadge(true, device.name);
    el('result').textContent = '[OK] Da ket noi BLE thanh cong voi ' + (device.name || 'kit') + '!';
  } catch (e) {
    updateBleBadge(false);
    el('result').textContent = 'Loi BLE: ' + e.message;
  }
};

// Render 28x28 visual preview and metadata
function updatePreview() {
  if (typeof thresholds === 'undefined') return null;
  const meta = quantizeWithMeta(ctx.getImageData(0, 0, 250, 250).data, 250, thresholds);
  const prevCanvas = el('preview');
  const infoEl = el('preprocessInfo');
  if (!prevCanvas) return meta;

  const pctx = prevCanvas.getContext('2d');
  if (!meta) {
    pctx.fillStyle = '#111';
    pctx.fillRect(0, 0, 28, 28);
    if (infoEl) infoEl.textContent = 'Chua co net ve.';
    return null;
  }

  const imgData = pctx.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    const val = meta.preview28[i];
    imgData.data[4 * i] = val;
    imgData.data[4 * i + 1] = val;
    imgData.data[4 * i + 2] = val;
    imgData.data[4 * i + 3] = 255;
  }
  pctx.putImageData(imgData, 0, 0);

  if (infoEl) {
    infoEl.textContent = `BBox: ${meta.bbox.w}x${meta.bbox.h} | CoM: (${meta.com.cx}, ${meta.com.cy}) | Active: ${meta.activeBits}/784 bit (${meta.activePct}%)`;
  }
  return meta;
}

// Hook pointer events on canvas to update preview
pad.addEventListener('pointerup', () => setTimeout(updatePreview, 50));

async function transmit(toBoard) {
  if (busy) return;
  busy = true;
  try {
    const meta = updatePreview();
    if (!meta || !meta.packed) {

    const body = Array.from(payload, b => hex(b, 2)).join('');
    if (body !== lastBody) {
      const seq = sequence++ & 65535;
      lastLine = 'I' + hex(seq, 4) + body + hex(crc([73, seq >> 8, seq & 255, ...payload]), 4) + '\n';
      lastBody = body;

      // Feature 1: Gửi FPGA qua BLE
      if (!writer) {
        throw Error('Chua ket noi Bluetooth! Hay mo muc "Cai dat & Ket noi BLE" de ket noi.');
      }
      el('result').textContent = 'Dang truyen goi 206 byte sang FPGA qua BLE...';
      const bytes = new TextEncoder().encode(line);
      for (let i = 0; i < bytes.length; i += 20) {
        const chunk = bytes.slice(i, i + 20);
        if (writer.properties.write) {
          await writer.writeValueWithResponse(chunk);
        } else {
          await writer.writeValueWithoutResponse(chunk);
        }
        // Gian cach 15ms giua cac chunk de tranh tran UART ring-buffer tren radio SoC
        await new Promise(r => setTimeout(r, 15));
      }
      el('result').textContent = `[GUI BLE XONG] Da truyen 206 byte toi radio BLE (Seq: ${line.slice(1, 5)}).\nQuan sat man hinh HDMI de xem ket qua suy luan.\n(Luu y: Top FPGA chi co UART RX; neu man hinh van giu nguyen so cu hoac dau -, kiem tra BLE/UART 115200 hoac bam Reset tren kit).`;
    } else {
      // Feature 2: Xuất vector_in trực tiếp & Tải về máy
      el('result').textContent = 'Dang trich xuat vector_in...';

      // 1. Chuyển đổi thành 784 bit nhị phân
      const bits = [];
      for (let b of payload) {
        for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
      }
      const vectorInStr = bits.join(' ');

      // 2. Tự động tải file vectors_in.txt về máy điện thoại/máy tính
      try {
        const blob = new Blob([vectorInStr + '\n'], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `vectors_in_${line.slice(1, 5)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        console.warn('File auto-download not supported on this browser');
      }

      // 3. Sao chép 784 bit vào clipboard (để paste nếu cần)
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(vectorInStr).catch(() => {});
      }

      // 4. Đồng bộ sang PC
      let pcResponseText = null;
      let cloudSynced = false;
      const pcBase = (el('pcUrl')?.value?.trim() || '').replace(/\/+$/, '');
      if (el('pcUrl')) localStorage.setItem('kanele_pc_url', pcBase);

      // A. Nếu có pcBase HTTPS hoặc mở qua HTTP nội bộ
      if (pcBase.startsWith('https://') || (window.location.protocol === 'http:' && !pcBase) || (pcBase && window.location.protocol === 'http:')) {
        try {
          const png = await new Promise(r => pad.toBlob(r));
          const verifyUrl = (pcBase || '') + '/verify';
          const resp = await fetch(verifyUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: new Blob([line, png])
          });
          if (resp.ok) {
            pcResponseText = await resp.text();
          }
        } catch (e) {
          // Bỏ qua lỗi direct fetch
        }
      }

      // B. Đồng bộ tự động qua Cloud Relay HTTPS (cho GitHub Pages)
      try {
        const cloudResp = await fetch('https://ntfy.sh/kanele_vector_sync', {
          method: 'POST',
          headers: { 'Title': 'KANELE Vector Frame', 'Priority': 'high' },
          body: JSON.stringify({
            line: line,
            bits: bits,
            seq: line.slice(1, 5)
          })
        });
        if (cloudResp.ok) cloudSynced = true;
      } catch (err) {
        console.warn('Cloud sync error:', err);
      }

      // 5. Hiển thị thông báo kết quả
      if (pcResponseText) {
        el('result').textContent = `[OK] DA GUI VE PC VA LUU CUSTOM THANH CONG!\n\n` +
          pcResponseText +
          `\n\n(Da tai file vectors_in_${line.slice(1, 5)}.txt ve may)`;
      } else if (cloudSynced) {
        el('result').textContent = `[OK] DA TRICH XUAT VA DONG BO VE PC THANH CONG!\n` +
          `* Ma Frame: ${line.slice(0, 10)}... (206 byte)\n` +
          `* So bit 1: ${meta.activeBits}/784 bit (${meta.activePct}%)\n` +
          `* Da dong bo qua Cloud -> PC (sync_vector.py) tu dong luu vao:\n` +
          `  firmware/sim/custom/vectors_in.txt\n\n` +
          `* Da tai file: vectors_in_${line.slice(1, 5)}.txt ve may!\n` +
          `* Da tu dong copy 784 bit vao bo nho tam (Clipboard).`;
      } else {
        el('result').textContent = `[OK] TRICH XUAT VECTOR_IN THANH CONG!\n` +
          `* Ma Frame: ${line.slice(0, 10)}... (206 byte)\n` +
          `* So bit 1: ${meta.activeBits}/784 bit (${meta.activePct}%)\n` +
          `* Da tai file: vectors_in_${line.slice(1, 5)}.txt ve may!\n` +
          `* Da tu dong copy 784 bit vao bo nho tam (Clipboard).\n\n` +
          `Dau vector: ${vectorInStr.slice(0, 40)}...`;
      }
    }
  } catch (e) {
    el('result').textContent = 'Loi: ' + e.message;
  } finally {
    busy = false;
  }
}

el('board').onclick = () => transmit(true);
el('verify').onclick = () => transmit(false);



  </script>
</body>
</html>
